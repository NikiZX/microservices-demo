name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform validate
        working-directory: terraform
        run: |
          terraform init -backend=false
          terraform validate

      - name: Helm lint
        run: helm lint ./helm-charts --strict

      - name: Build Docker images
        run: |
          docker build -t adservice:ci src/adservice
          docker build -t cartservice:ci src/cartservice/src
          docker build -t checkoutservice:ci src/checkoutservice
          docker build -t currencyservice:ci src/currencyservice
          docker build -t emailservice:ci src/emailservice
          docker build -t frontend:ci src/frontend
          docker build -t paymentservice:ci src/paymentservice
          docker build -t productcatalogservice:ci src/productcatalogservice
          docker build -t recommendationservice:ci src/recommendationservice
          docker build -t shippingservice:ci src/shippingservice

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Trivy security scan
        run: |
          for image in \
            adservice \
            cartservice \
            checkoutservice \
            currencyservice \
            emailservice \
            frontend \
            paymentservice \
            productcatalogservice \
            recommendationservice \
            shippingservice
          do
            echo "Scanning ${image}:ci..."
            # Report-only for now (demo base images often have HIGH/CRITICAL findings)
            trivy image --exit-code 0 --severity HIGH,CRITICAL --ignore-unfixed "${image}:ci"
          done
