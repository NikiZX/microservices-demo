{{- if .Values.loadGenerator.create }}
{{- if .Values.serviceAccounts.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.loadGenerator.name }}
  namespace: {{ .Release.Namespace }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.loadGenerator.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.loadGenerator.name }}
spec:
  selector:
    matchLabels:
      app: {{ .Values.loadGenerator.name }}
  replicas: {{ .Values.loadGenerator.replicas }}
  template:
    metadata:
      labels:
        app: {{ .Values.loadGenerator.name }}
      annotations:
        sidecar.istio.io/rewriteAppHTTPProbers: "true"
    spec:
      serviceAccountName: {{ include "onlineboutique.serviceAccountName" (dict "Values" .Values "serviceName" .Values.loadGenerator.name) }}
      terminationGracePeriodSeconds: 5
      restartPolicy: Always
      {{- include "onlineboutique.podSecurityContext" . | nindent 6 }}
      {{- if .Values.loadGenerator.checkFrontendInitContainer }}
      initContainers:
      - command:
        - /bin/sh
        - -exc
        - |
          MAX_RETRIES=12
          RETRY_INTERVAL=10
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $i: Pinging frontend: ${FRONTEND_ADDR}..."
            STATUSCODE=$(wget --server-response http://${FRONTEND_ADDR} 2>&1 | awk '/^  HTTP/{print $2}')
            if [ $STATUSCODE -eq 200 ]; then
                echo "Frontend is reachable."
                exit 0
            fi
            echo "Error: Could not reach frontend - Status code: ${STATUSCODE}"
            sleep $RETRY_INTERVAL
          done
          echo "Failed to reach frontend after $MAX_RETRIES attempts."
          exit 1
        name: frontend-check
        {{- include "onlineboutique.containerSecurityContext" . | nindent 8 }}
        image: {{ .Values.loadGenerator.busyboxImage }}
        env:
        - name: FRONTEND_ADDR
          value: "{{ .Values.frontend.name }}:80"
      {{- end }}
      containers:
      - name: main
        {{- include "onlineboutique.containerSecurityContext" . | nindent 8 }}
        image: {{ include "onlineboutique.image" (dict "Values" .Values "Chart" .Chart "imageName" .Values.loadGenerator.name) }}
        env:
        - name: FRONTEND_ADDR
          value: "{{ .Values.frontend.name }}:80"
        - name: USERS
          value: {{ .Values.loadGenerator.users | quote }}
        - name: RATE
          value: {{ .Values.loadGenerator.rate | quote }}
        resources:
          {{- toYaml .Values.loadGenerator.resources | nindent 10 }}
{{- end }}
