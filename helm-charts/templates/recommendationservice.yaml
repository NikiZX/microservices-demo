{{- if .Values.recommendationService.create }}
{{- if .Values.serviceAccounts.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.recommendationService.name }}
  namespace: {{ .Release.Namespace }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.recommendationService.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.recommendationService.name }}
spec:
  selector:
    matchLabels:
      app: {{ .Values.recommendationService.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.recommendationService.name }}
    spec:
      serviceAccountName: {{ include "onlineboutique.serviceAccountName" (dict "Values" .Values "serviceName" .Values.recommendationService.name) }}
      terminationGracePeriodSeconds: 5
      {{- include "onlineboutique.podSecurityContext" . | nindent 6 }}
      containers:
      - name: server
        {{- include "onlineboutique.containerSecurityContext" . | nindent 8 }}
        image: {{ include "onlineboutique.image" (dict "Values" .Values "Chart" .Chart "imageName" .Values.recommendationService.name) }}
        ports:
        - containerPort: 8080
        readinessProbe:
          periodSeconds: 5
          grpc:
            port: 8080
        livenessProbe:
          periodSeconds: 5
          grpc:
            port: 8080
        env:
        - name: PORT
          value: "8080"
        - name: PRODUCT_CATALOG_SERVICE_ADDR
          value: "{{ .Values.productCatalogService.name }}:3550"
        - name: DISABLE_PROFILER
          value: "1"
        resources:
          {{- toYaml .Values.recommendationService.resources | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.recommendationService.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.recommendationService.name }}
spec:
  type: ClusterIP
  selector:
    app: {{ .Values.recommendationService.name }}
  ports:
  - name: grpc
    port: 8080
    targetPort: 8080
{{- end }}
