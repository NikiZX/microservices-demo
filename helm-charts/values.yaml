# Default values for onlineboutique.
# Converted from release/kubernetes-manifests.yaml

images:
  repository: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo
  tag: ""
  # false => repository/service:tag (Artifact Registry / one ECR repo per service)
  # true  => repository:service-tag (single ECR repository)
  singleRepository: false

serviceAccounts:
  create: true

securityContext:
  enable: true

frontend:
  create: true
  name: frontend
  externalService: true
  enableProfiler: "0"
  shoppingAssistantServiceAddr: shoppingassistantservice:80
  loadBalancer:
    # Annotations applied to the frontend external Service of type `LoadBalancer`.
    # On EKS, this provisions a Network Load Balancer (NLB) via the AWS Load
    # Balancer Controller. NOTE: an Application Load Balancer (ALB) CANNOT be
    # created from a Service - use frontend.ingress below for ALB instead.
    #
    # Recommended annotations for an NLB with IP targets:
    # annotations:
    #   service.beta.kubernetes.io/aws-load-balancer-type: external
    #   service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
    #   service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
    annotations: {}
  ingress:
    # Creates an Ingress for the frontend. On EKS with the AWS Load Balancer
    # Controller installed, set ingressClassName to "alb" to provision an
    # Application Load Balancer (ALB).
    create: false
    ingressClassName: alb
    # Recommended annotations for an ALB with IP targets:
    annotations: {}
      # alb.ingress.kubernetes.io/scheme: internet-facing
      # alb.ingress.kubernetes.io/target-type: ip
      # alb.ingress.kubernetes.io/healthcheck-path: /_healthz
    # Optional host for the Ingress rule. Leave empty to match all hosts.
    host: ""
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

adService:
  create: true
  name: adservice
  resources:
    requests:
      cpu: 200m
      memory: 180Mi
    limits:
      cpu: 300m
      memory: 300Mi

cartService:
  create: true
  name: cartservice
  redisAddr: redis-cart:6379
  resources:
    requests:
      cpu: 200m
      memory: 64Mi
    limits:
      cpu: 300m
      memory: 128Mi

redisCart:
  create: true
  name: redis-cart
  image: redis:alpine
  resources:
    requests:
      cpu: 70m
      memory: 200Mi
    limits:
      cpu: 125m
      memory: 256Mi

loadGenerator:
  create: true
  name: loadgenerator
  replicas: 1
  users: "10"
  rate: "1"
  checkFrontendInitContainer: true
  busyboxImage: busybox:1.38.0@sha256:fd8d9aa63ba2f0982b5304e1ee8d3b90a210bc1ffb5314d980eb6962f1a9715d
  resources:
    requests:
      cpu: 300m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

currencyService:
  create: true
  name: currencyservice
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

recommendationService:
  create: true
  name: recommendationservice
  resources:
    requests:
      cpu: 100m
      memory: 220Mi
    limits:
      cpu: 200m
      memory: 450Mi

checkoutService:
  create: true
  name: checkoutservice
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

emailService:
  create: true
  name: emailservice
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

paymentService:
  create: true
  name: paymentservice
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

shippingService:
  create: true
  name: shippingservice
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

productCatalogService:
